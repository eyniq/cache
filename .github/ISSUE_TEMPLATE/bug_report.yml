name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security problems do not open an issue: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Client (npm, pnpm, yarn) and version, relevant configuration (no secrets), request path.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove tokens and private package names.
      render: shell
