{{- if and (eq .Values.storage.type "fs") .Values.storage.fs.persistence.enabled (not .Values.storage.fs.persistence.existingClaim) }}
# Shared by every replica: objects are write-once and renamed into place, so ReadWriteMany
# needs no locking. The filesystem must be case-sensitive (docs/OPERATIONS.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "eyniq-cache.fullname" . }}-data
  labels:
    {{- include "eyniq-cache.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.storage.fs.persistence.accessMode }}
  {{- with .Values.storage.fs.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.fs.persistence.size }}
{{- end }}
